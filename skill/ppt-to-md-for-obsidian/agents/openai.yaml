interface:
  display_name: "PPT/PDF to Obsidian Notes"
  short_description: "Convert courseware into source-checked Obsidian notes"
  default_prompt: "Use $ppt-to-md-for-obsidian to convert these lecture slides or PDFs into Obsidian-ready Markdown notes with formulas, source-labeled worked examples, scoped claims, source manifests, links, and review pages; keep audit artifacts out of the vault unless explicitly requested."

policy:
  allow_implicit_invocation: true
