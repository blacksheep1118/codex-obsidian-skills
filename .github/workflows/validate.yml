name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root validation (${{ matrix.profile }}, ${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            profile: full
          - os: ubuntu-latest
            python-version: "3.9"
            profile: minimum
          - os: ubuntu-latest
            python-version: "3.12"
            profile: newest
          - os: macos-latest
            python-version: "3.11"
            profile: platform
          - os: windows-latest
            python-version: "3.11"
            profile: platform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install root validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check repository hygiene
        if: matrix.profile == 'full'
        run: python scripts/check_repo_hygiene.py

      - name: Run full Ruff checks
        if: matrix.profile == 'full'
        run: python -m ruff check . --no-cache

      - name: Compile repository scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-root-pycache
        run: python -m compileall -q scripts

      - name: Run root tests
        if: matrix.profile == 'full'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          SOLVENOTES_TEST_SELF_CHECK_LEVEL: runtime
        run: python -m pytest -q --durations=20

      - name: Run minimum/newest core tests
        if: matrix.profile == 'minimum' || matrix.profile == 'newest'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q --durations=20
          tests/test_skill_metadata.py
          tests/test_safe_io.py
          tests/test_repo_hygiene.py

      - name: Run platform smoke tests
        if: matrix.profile == 'platform'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          SOLVENOTES_TEST_SELF_CHECK_LEVEL: runtime
        run: >-
          python -m pytest -q --durations=20
          tests/test_management_scripts.py
          tests/test_shared_resources.py

      - name: Check shared metadata
        if: matrix.profile == 'full'
        run: |
          python scripts/check_openai_yaml_sync.py
          python scripts/sync_shared_resources.py --check
          python scripts/install_skill.py --all --destination "${{ runner.temp }}/codex-skills" --self-check --self-check-level smoke

      - name: Run runtime install smoke
        if: matrix.profile == 'minimum' || matrix.profile == 'newest'
        run: python scripts/install_skill.py --all --destination "${{ runner.temp }}/codex-skills" --self-check --self-check-level runtime

  skill:
    name: Skill validation (${{ matrix.skill }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: notes-to-scientific-ppt
            validator: scripts/validate_skill.py
          - skill: obsidian-vault-organizer
            validator: scripts/validate_skill.py
          - skill: ppt-to-md-for-obsidian
            validator: scripts/validate_skill_repo.py
          - skill: web-course-notes-for-obsidian
            validator: scripts/validate_skill.py
          - skill: algorithm-job-notes-for-obsidian
            validator: scripts/validate_skill.py
          - skill: solvenotes-vault-maintainer
            validator: scripts/validate_skill.py
            test_vault_root: fixtures/solvenotes-mini-vault

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install this skill's dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skill/${{ matrix.skill }}/requirements-dev.txt
          python -m pip check

      - name: Compile skill scripts
        working-directory: skill/${{ matrix.skill }}
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-skill-pycache
        run: python -m compileall scripts

      - name: Run skill tests
        working-directory: skill/${{ matrix.skill }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          SOLVENOTES_VAULT_ROOT: ${{ matrix.test_vault_root }}
        run: python -m pytest -q --durations=20 -p no:cacheprovider tests

      - name: Validate skill metadata
        working-directory: skill/${{ matrix.skill }}
        run: python ${{ matrix.validator }}
