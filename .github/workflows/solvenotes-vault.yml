name: Solvenotes skill and vault quality

on:
  workflow_dispatch:
  push:
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/solvenotes-vault.yml"
  pull_request:
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/solvenotes-vault.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository development dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate all Skill metadata and tests
        run: python3 scripts/validate_all.py --quick
      - name: Validate algorithm-job Skill tests
        run: python3 scripts/validate_all.py --skill algorithm-job-notes-for-obsidian
      - name: Validate Solvenotes maintainer Skill tests
        run: python3 scripts/validate_all.py --skill solvenotes-vault-maintainer

  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: blacksheep1118/notes
          ref: main
          path: notes-vault
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maintainer Skill dependencies
        run: python3 -m pip install -r skill/solvenotes-vault-maintainer/requirements-dev.txt
      - name: Run the external full vault gate
        env:
          SOLVENOTES_VAULT_ROOT: ${{ github.workspace }}/notes-vault
        run: bash skill/solvenotes-vault-maintainer/scripts/dev_check.sh full
      - name: Build and inspect a clean vault package
        env:
          SOLVENOTES_VAULT_ROOT: ${{ github.workspace }}/notes-vault
        run: |
          python3 skill/solvenotes-vault-maintainer/scripts/package_vault.py \
            --root "$SOLVENOTES_VAULT_ROOT" --output /tmp/solvenotes-notes-clean.zip
          unzip -l /tmp/solvenotes-notes-clean.zip
          ! unzip -l /tmp/solvenotes-notes-clean.zip | grep -E '(__MACOSX|(^|/)\._|\.DS_Store|workspace\.json|graph\.json|__pycache__|\.pyc$)'
